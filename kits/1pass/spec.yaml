schemaVersion: '2'
kind: mixin
name: agbx-1pass
displayName: 1Password CLI; credential injection configured on host
description: 1Password CLI; credential injection configured on host
permissions:
  network:
    allow:
    - cache.agilebits.com
    - '*.1password.com'
    - '*.1password.eu'
    - '*.1password.ca'
setup:
  install:
  - command: bash /home/agent/.local/share/agbx/1pass.sh
    user: '1000'
    description: 1pass
