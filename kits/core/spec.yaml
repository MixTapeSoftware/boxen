schemaVersion: '2'
kind: mixin
name: boxen-core
displayName: Shared development tools and shell
description: Shared development tools and shell
# Core is always installed first, so the hosts shared by most kits live here
# and optional kits list only their own extras.
permissions:
  network:
    allow:
    - github.com
    - api.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - codeload.github.com
    - archive.ubuntu.com:80
    - security.ubuntu.com:80
    - ports.ubuntu.com:80
    - archive.ubuntu.com:443
    - security.ubuntu.com:443
    - ports.ubuntu.com:443
    # apt sources in Docker's images.
    - download.docker.com
    - cli.github.com
    - nodejs.org
    - registry.npmjs.org
    - go.dev
    - dl.google.com
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
    - api.mason-registry.dev
    - www.skills.sh
    # mise's site, for downloads.
    - mise.en.dev
    # The CDN for public.ecr.aws image layers, such as Supabase's. Every
    # sandbox has Docker, and sbx's Balanced preset allows the registry but
    # not these hosts, so pulls from it fail without them.
    - d5l0dvt14r5h8.cloudfront.net
    - d2glxqk2uabbnd.cloudfront.net
    # The Supabase CLI's edge runtime imports Deno std from deno.land when it
    # boots, so supabase start fails without it.
    - deno.land
    # Supabase's hosted MCP server.
    - mcp.supabase.com
setup:
  install:
  - command: bash /home/agent/.local/share/boxen/core-root.sh
    user: '0'
    description: core-root
  - command: bash /home/agent/.local/share/boxen/sudo-policy.sh
    user: '0'
    description: sudo-policy
  - command: bash /home/agent/.local/share/boxen/core-user.sh
    user: '1000'
    description: core-user
agentInstructions:
  content: |
    sudo is not available in this sandbox. When a task needs root, ask the
    user to run it from a session opened with boxen shell --with-sudo.
