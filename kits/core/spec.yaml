schemaVersion: '2'
kind: mixin
name: agbx-core
displayName: Shared development tools and shell
description: Shared development tools and shell
# Core is always installed first, so the hosts shared by most kits live here
# and optional kits list only their own extras.
permissions:
  network:
    allow:
    - github.com
    - api.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - codeload.github.com
    - archive.ubuntu.com:80
    - security.ubuntu.com:80
    - ports.ubuntu.com:80
    - archive.ubuntu.com:443
    - security.ubuntu.com:443
    - ports.ubuntu.com:443
    # apt sources in Docker's images.
    - download.docker.com
    - cli.github.com
    - nodejs.org
    - registry.npmjs.org
    - go.dev
    - dl.google.com
    - proxy.golang.org
    - sum.golang.org
    - storage.googleapis.com
setup:
  install:
  - command: bash /home/agent/.local/share/agbx/core-root.sh
    user: '0'
    description: core-root
  - command: bash /home/agent/.local/share/agbx/sudo-policy.sh
    user: '0'
    description: sudo-policy
  - command: bash /home/agent/.local/share/agbx/core-user.sh
    user: '1000'
    description: core-user
agentInstructions:
  content: |
    sudo is not available in this sandbox. When a task needs root, ask the
    user to run it from a session opened with agbx shell --with-sudo.
