schemaVersion: '2'
kind: mixin
name: agbx-nvchad
displayName: Chadception Neovim configuration
description: Chadception Neovim configuration
permissions:
  network:
    allow:
    - pypi.org
    - files.pythonhosted.org
    - hex.pm
    - repo.hex.pm
    - builds.hex.pm
    - elixir-lang.org
    - registry.npmmirror.com
    # NvChad's nvim-cmp dependency cmp-async-path is hosted on Codeberg.
    - codeberg.org
setup:
  install:
  - command: bash /home/agent/.local/share/agbx/nvchad.sh
    user: '1000'
    description: nvchad
