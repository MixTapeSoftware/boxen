schemaVersion: '2'
kind: mixin
name: boxen-supabase-serve
displayName: Seven HTTPS routes for app and Supabase
description: Seven HTTPS routes for app and Supabase
# boxen tailscale join applies the routes once. tailscaled keeps serve
# config in its state volume, so nothing reapplies them on start.
environment:
  variables:
    BOXEN_SERVE_PRESET: supabase
