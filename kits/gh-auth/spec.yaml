schemaVersion: '2'
kind: mixin
name: boxen-gh-auth
displayName: GitHub CLI and Git credential helper
description: GitHub CLI and Git credential helper
permissions:
  network:
    allow:
    - gist.github.com
setup:
  install:
  - command: bash /home/agent/.local/share/boxen/gh-auth.sh
    user: '1000'
    description: gh-auth
