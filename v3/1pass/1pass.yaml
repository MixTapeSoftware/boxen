# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Boxen 1Password
description: 1Password's hosts for the op CLI baked into the image
kind: mixin
provides: ["boxen-1pass@1.0.0"]
requires: ["boxen >= 1.0.0"]
capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - cache.agilebits.com
          - "*.1password.com"
          - "*.1password.eu"
          - "*.1password.ca"
