# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Boxen RTK for Claude Code
description: RTK's PreToolUse hook in Claude Code's settings
kind: mixin
provides: ["boxen-rtkplus-claude@1.0.0"]
# Requiring the agent orders this hook after the agent mixin seeds its settings.
requires: ["boxen >= 1.0.0", "claude >= 2.0.0"]
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: bash /usr/local/share/boxen/rtk-claude-hook.sh
          user: "1000"
          description: Add the RTK PreToolUse hook to Claude's settings
