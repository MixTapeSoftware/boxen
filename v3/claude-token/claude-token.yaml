# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Boxen Claude subscription token
description: Lets a per-sandbox Claude subscription token, stored on the host, reach Anthropic as the Bearer token Claude Code sends
kind: mixin
provides: ["boxen-claude-token@1.0.0"]
# Requiring the agent orders the hook after Docker's mixin seeds its settings.
requires: ["boxen >= 1.0.0", "claude >= 2.0.0"]
capabilities:
  # sbx checks each kit alone: an inject domain must be in its own allow list.
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - api.anthropic.com
  # Docker's Claude mixin swaps the proxy's placeholder only in an x-api-key
  # header, which Anthropic rejects for a subscription token. This routing-only
  # addition to the same service has the proxy swap it in the Authorization
  # header too, where Claude Code puts CLAUDE_CODE_OAUTH_TOKEN. The token
  # itself is `sbx secret set --sandbox NAME anthropic` on the host, from
  # `claude setup-token` run as the account the sandbox should bill; the
  # sandbox only ever holds the placeholder.
  - type: com.docker.sandbox/credential@1
    name: Anthropic subscription token
    optional: true
    description: Proxy-managed Bearer injection for a per-sandbox subscription token
    config:
      service: anthropic
      phase: [runtime]
      apiKey:
        inject:
          - domain: api.anthropic.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: bash /usr/local/share/boxen/claude-token.sh
          user: "1000"
          description: Point Claude Code at the placeholder as a subscription token when one is bound
