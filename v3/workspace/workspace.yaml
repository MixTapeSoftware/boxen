# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Boxen workspace
description: The agent-owned workspace at /home/agent/workspace, linked from /workspace
kind: mixin
provides: ["boxen-workspace@1.0.0"]
requires: ["boxen >= 1.0.0"]
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: bash /usr/local/share/boxen/workspace.sh
          user: "0"
          description: Create the agent-owned workspace and link /workspace
