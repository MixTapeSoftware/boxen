# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Boxen Tailscale
description: A userspace Tailscale node per sandbox; the image already has Tailscale
kind: mixin
provides: ["boxen-tailscale@1.0.0"]
requires: ["boxen >= 1.0.0"]
capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - tailscale.com
          # Also covers pkgs.tailscale.com and the DERP relays.
          - "*.tailscale.com"
          - "*.tailscale.io"
          # tailscale serve --https gets the node's certificate from Let's
          # Encrypt; tailscaled does the ACME exchange itself (DNS-01, the
          # record is set by the control plane), so this is the only host.
          - acme-v02.api.letsencrypt.org
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The root helper may not see create's environment, so the preset
        # chosen at create is kept in a file.
        - command: [sh, -c, 'printf "%s\n" "${BOXEN_SERVE_PRESET:-}" > /etc/boxen/serve-preset']
          user: "0"
          env: [BOXEN_SERVE_PRESET]
          description: Record the serve preset for the root helper
      startup:
        - command: [bash, /usr/local/share/boxen/tailscale-start.sh]
          user: "0"
          background: true
          description: Start userspace tailscaled
